name: Recover stuck Core 2 workflow run

on:
  push:
    paths:
      - ".github/workflows/recover-cancel-stuck-core2.yml"

permissions:
  actions: write

jobs:
  cancel-stuck-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel stuck run 12
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Requesting cancellation of stuck Core 2 workflow run 38164127370."
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/38164127370/cancel"
          echo "Cancellation request accepted."
