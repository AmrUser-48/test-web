name: Temporary Core 2 build runner (SSH + VNC over Tailscale)

on:
  # Temporary recovery trigger: start one run with the fixed restore step, then remove.
  push:
    paths:
      - ".github/workflows/temporary-core2-build-runner-vnc.yml"
  workflow_dispatch:
    inputs:
      session_minutes:
        description: How long to keep SSH and VNC available
        required: true
        type: choice
        options:
          - "30"
          - "60"
          - "180"
          - "300"
          - "350"
        default: "350"

permissions:
  contents: read
  actions: write

concurrency:
  group: temporary-core2-build-runner-vnc
  cancel-in-progress: true

jobs:
  shell-vnc:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CFLAGS: "-O2 -march=core2 -mtune=core2"
      CXXFLAGS: "-O2 -march=core2 -mtune=core2"
      FFLAGS: "-O2 -march=core2 -mtune=core2"
      FCFLAGS: "-O2 -march=core2 -mtune=core2"
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      SESSION_MINUTES: ${{ inputs.session_minutes || '350' }}

    steps:
      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TAILSCALE_AUTHKEY" ]]; then
            echo "::error::Set repository secret TAILSCALE_AUTHKEY."
            exit 1
          fi
          if [[ -z "$VNC_PASSWORD" || ${#VNC_PASSWORD} -lt 8 ]]; then
            echo "::error::Set repository secret VNC_PASSWORD (at least 8 characters)."
            exit 1
          fi

      - name: Connect runner to private Tailscale network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: github-core2-${{ github.run_id }}

      - name: Preserve system DNS for GitHub cache and artifacts
        shell: bash
        run: |
          set -euo pipefail
          sudo tailscale set --accept-dns=false

      - name: Restore encrypted desktop-state cache
        id: state-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/core2-vnc-state.tar.gz.enc
          key: core2-vnc-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            core2-vnc-state-${{ runner.os }}-

      - name: Check whether desktop cache restored a state file
        id: cached-state
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/core2-vnc-state.tar.gz.enc" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find latest encrypted desktop backup artifact
        id: latest-state
        if: steps.cached-state.outputs.available != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          output = os.environ["GITHUB_OUTPUT"]
          values = {"run_id": "", "artifact_name": ""}
          try:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts?per_page=100",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "core2-vnc-state-restore",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  artifacts = json.load(response).get("artifacts", [])
              for artifact in artifacts:
                  if artifact.get("expired") or not artifact.get("name", "").startswith("core2-vnc-state-"):
                      continue
                  run = artifact.get("workflow_run") or {}
                  current_name = f"core2-vnc-state-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
                  if artifact.get("name") == current_name:
                      continue
                  if run.get("head_branch") != os.environ.get("GITHUB_REF_NAME"):
                      continue
                  values = {
                      "run_id": str(run.get("id", "")),
                      "artifact_name": artifact["name"],
                  }
                  break
          except Exception as exc:
              print("::warning::Could not locate previous encrypted state artifact: " + str(exc))
          with open(output, "a", encoding="utf-8") as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          PY

      - name: Download encrypted backup when cache is unavailable
        if: steps.cached-state.outputs.available != 'true' && steps.latest-state.outputs.artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.latest-state.outputs.artifact_name }}
          run-id: ${{ steps.latest-state.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}

      - name: Restore desktop, browser profile, and files
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/core2-vnc-state.tar.gz.enc"
          # IMPORTANT: never unpack under $HOME. The restored archive contains
          # ./work, and RUNNER_TEMP itself lives under $HOME/work/_temp. Unpacking
          # there makes the source overlap the destination during cp -a and can
          # cause a huge recursive/slow copy. /tmp is outside $HOME.
          restore_dir="/tmp/core2-vnc-state-restore-$GITHUB_RUN_ID"
          rm -rf "$restore_dir"
          mkdir -p "$restore_dir" "$HOME"
          trap 'rm -rf "$restore_dir"' EXIT

          if [[ -s "$archive" ]]; then
            echo "Encrypted desktop-state archive: $(du -h "$archive" | cut -f1)"
            echo "Free space before restore:"
            df -h "$HOME" /tmp
            if timeout --foreground --signal=TERM --kill-after=10s 240s bash -o pipefail -c '
              openssl enc -d -aes-256-cbc -pbkdf2 -salt \
                -pass env:TAILSCALE_AUTHKEY -in "$1" |
                tar -xzf - -C "$2"
            ' _ "$archive" "$restore_dir"; then
              echo "Archive extracted; restoring files into the runner home directory."
              cp -a "$restore_dir/." "$HOME/"
              echo "DESKTOP_STATE_RESTORED=1" >> "$GITHUB_ENV"
              echo "Restored encrypted XFCE settings, Chrome profile, Desktop, Documents, Downloads, and workspace files."
            else
              rc=$?
              echo "::warning::Could not extract/decrypt desktop-state archive (exit $rc or 240-second timeout); starting with a fresh desktop."
              echo "DESKTOP_STATE_RESTORED=0" >> "$GITHUB_ENV"
            fi
          else
            echo "No saved desktop state found; starting with the initial dark deskbar layout."
            echo "DESKTOP_STATE_RESTORED=0" >> "$GITHUB_ENV"
          fi

      - name: Install Core 2 build tools and private SSH/VNC services
        shell: bash
        run: |
          set -euo pipefail
          TAILSCALE_IP="$(tailscale ip -4 | head -n 1)"
          if [[ -z "$TAILSCALE_IP" ]]; then
            echo "::error::Tailscale did not assign a private IP."
            exit 1
          fi
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential gcc g++ make cmake ninja-build pkg-config \
            git ca-certificates curl wget xz-utils bzip2 unzip ccache \
            dpkg-dev devscripts debhelper fakeroot quilt autoconf automake \
            libtool gettext python3 python3-venv meson \
            xfce4 xfce4-terminal dbus-x11 arc-theme \
            tigervnc-standalone-server tigervnc-tools socat openssh-server

          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/google-chrome.deb
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome.deb

          sudo tee /etc/dpkg/buildflags.conf >/dev/null <<'FLAGS'
          SET CFLAGS -O2 -march=core2 -mtune=core2
          SET CXXFLAGS -O2 -march=core2 -mtune=core2
          SET FFLAGS -O2 -march=core2 -mtune=core2
          SET FCFLAGS -O2 -march=core2 -mtune=core2
          FLAGS

          mkdir -p "$HOME/.vnc"
          VNC_PASSWD="$(command -v vncpasswd || true)"
          if [[ -z "$VNC_PASSWD" ]]; then
            for candidate in /usr/bin/vncpasswd /usr/bin/tigervncpasswd /usr/lib/tigervnc/vncpasswd; do
              if [[ -x "$candidate" ]]; then VNC_PASSWD="$candidate"; break; fi
            done
          fi
          if [[ -z "$VNC_PASSWD" ]]; then
            echo "::error::TigerVNC vncpasswd was not installed."
            dpkg -l 'tigervnc*' || true
            exit 1
          fi
          printf '%s\n' "$VNC_PASSWORD" | "$VNC_PASSWD" -f > "$HOME/.vnc/passwd"
          chmod 600 "$HOME/.vnc/passwd"

          cat > "$HOME/.vnc/xstartup" <<'XSTART'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          # Export one DBus session so the theme and panel settings below update
          # the same live XFCE session that is shown over VNC.
          eval "$(dbus-launch --sh-syntax)"
          startxfce4 &
          XFCE_PID=$!

          # Wait until XFCE has initialized its panel configuration.
          for _ in $(seq 1 30); do
            if xfconf-query -c xfce4-panel -p /panels >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          set_xfconf() {
            channel="$1"
            property="$2"
            type="$3"
            value="$4"
            if xfconf-query -c "$channel" -p "$property" -s "$value" >/dev/null 2>&1; then
              return 0
            fi
            xfconf-query -c "$channel" -p "$property" --create --type "$type" --set "$value"
          }

          # Only seed Arc-Dark/right-side deskbar defaults on the first session.
          # On later sessions, leave the restored XFCE preferences untouched.
          if [[ "${DESKTOP_STATE_RESTORED:-0}" != "1" ]]; then
            set_xfconf xsettings /Net/ThemeName string Arc-Dark
            set_xfconf xfwm4 /general/theme string Arc-Dark
            set_xfconf xfce4-panel /panels/dark-mode bool true
            set_xfconf xfce4-panel /panels/panel-1/mode int 2
            set_xfconf xfce4-panel /panels/panel-1/position string 'p=2;x=0;y=0'
            set_xfconf xfce4-panel /panels/panel-1/position-locked bool true
            set_xfconf xfce4-panel /panels/panel-1/length int 55
            set_xfconf xfce4-panel /panels/panel-1/length-adjust bool true
            set_xfconf xfce4-panel /panels/panel-1/size int 48
            set_xfconf xfce4-panel /panels/panel-1/nrows int 2
          fi

          # Launch ChatGPT only after the dark theme and panel settings are live.
          mkdir -p "$HOME/.config/google-chrome"
          google-chrome-stable --user-data-dir="$HOME/.config/google-chrome" --no-first-run --no-default-browser-check https://chatgpt.com >/tmp/chromium.log 2>&1 &
          wait "$XFCE_PID"
          XSTART
          chmod +x "$HOME/.vnc/xstartup"

          vncserver :1 -localhost yes -geometry 1440x900 -depth 24

          # Relay VNC from loopback to the Tailscale IP only; never bind VNC to
          # 0.0.0.0 or expose it via a public HTTPS tunnel.
          nohup socat "TCP-LISTEN:5900,bind=$TAILSCALE_IP,reuseaddr,fork" TCP4:127.0.0.1:5901 \
            >/tmp/socat-vnc.log 2>&1 </dev/null &
          echo "$!" > /tmp/socat-vnc.pid

          SSH_USER="$(id -un)"
          KEY_BASE="$RUNNER_TEMP/core2-runner-ssh"
          ssh-keygen -q -t ed25519 -N "" -C "GitHub Core2 runner $GITHUB_RUN_ID" -f "$KEY_BASE"
          install -d -m 700 "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          cat "$KEY_BASE.pub" >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"

          sudo tee /etc/ssh/sshd_config.d/90-tailscale-runner.conf >/dev/null <<EOF
          ListenAddress $TAILSCALE_IP
          PermitRootLogin no
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          AllowUsers $SSH_USER
          EOF
          sudo install -d -m 0755 /run/sshd
          sudo /usr/sbin/sshd -t
          sudo systemctl restart ssh

          # Encrypt the private key with the existing VNC password so an artifact
          # download alone does not grant SSH access.
          ssh-keygen -p -P "" -N "$VNC_PASSWORD" -f "$KEY_BASE" >/dev/null
          echo "SSH_USER=$SSH_USER" >> "$GITHUB_ENV"

          ready=0
          for _ in $(seq 1 30); do
            if nc -z "$TAILSCALE_IP" 5900 && nc -z "$TAILSCALE_IP" 22; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            echo "=== SSH listener ==="
            sudo ss -lntp || true
            echo "=== VNC relay ==="
            cat /tmp/socat-vnc.log || true
            echo "=== TigerVNC log ==="
            cat "$HOME"/.vnc/*.log || true
            echo "::error::VNC or SSH did not start on the Tailscale IP."
            exit 1
          fi

          # Confirm VNC speaks RFB and offers password authentication.
          python3 - "$TAILSCALE_IP" <<'PY'
          import socket, sys, time
          host = sys.argv[1]
          deadline = time.monotonic() + 30
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection((host, 5900), timeout=3) as sock:
                      sock.settimeout(3)
                      greeting = b""
                      while len(greeting) < 12:
                          chunk = sock.recv(12 - len(greeting))
                          if not chunk:
                              raise RuntimeError("connection closed before RFB greeting")
                          greeting += chunk
                      if not greeting.startswith(b"RFB "):
                          raise RuntimeError(f"unexpected greeting: {greeting!r}")
                      sock.sendall(b"RFB 003.008\n")
                      count = sock.recv(1)
                      if not count:
                          raise RuntimeError("VNC closed before security negotiation")
                      n = count[0]
                      types = b""
                      while len(types) < n:
                          part = sock.recv(n - len(types))
                          if not part:
                              raise RuntimeError("VNC closed during security negotiation")
                          types += part
                      if 2 not in types:
                          raise RuntimeError(f"VNC did not offer VNC password auth: {list(types)}")
                      print(f"PASS: VNC RFB greeting and password-auth offer on {host}:5900")
                      break
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise RuntimeError(f"VNC handshake did not become ready: {last_error}")
          PY

          ssh-keyscan -T 3 -p 22 "$TAILSCALE_IP" > "$RUNNER_TEMP/known-hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/known-hosts"

          {
            echo "## Temporary Core 2 build runner — Tailscale SSH + VNC"
            echo
            echo "- Tailscale IP: $TAILSCALE_IP"
            echo "- VNC: ${TAILSCALE_IP}::5900 (password: repository secret VNC_PASSWORD)"
            echo "- SSH: ssh -i core2-runner-ssh ${SSH_USER}@${TAILSCALE_IP}"
            echo "- Download artifact: core2-runner-tailscale-ssh-key-${GITHUB_RUN_ID}"
            echo "- SSH key passphrase: the same VNC_PASSWORD secret."
            echo "- SSH and VNC listen only on the runner's Tailscale address. No Cloudflare tunnel or Upterm is used."
            echo "- Session duration: $SESSION_MINUTES minutes. Cancel this workflow to stop the runner."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PASS: private VNC and SSH endpoints are listening on $TAILSCALE_IP."

      - name: Upload encrypted SSH private key
        uses: actions/upload-artifact@v4
        with:
          name: core2-runner-tailscale-ssh-key-${{ github.run_id }}
          path: ${{ runner.temp }}/core2-runner-ssh
          if-no-files-found: error
          retention-days: 1

      - name: Keep SSH and VNC available
        shell: bash
        run: sleep "$((SESSION_MINUTES * 60))"

      - name: Snapshot and encrypt desktop state
        id: snapshot-state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          state_file="$RUNNER_TEMP/core2-vnc-state.tar.gz.enc"
          mkdir -p "$HOME/Desktop" "$HOME/Documents" "$HOME/Downloads"
          mkdir -p "$HOME/.config/xfce4" "$HOME/.config/gtk-3.0" "$HOME/.config/google-chrome"

          # Close Chrome cleanly before archiving its cookies/profile databases.
          mapfile -t chrome_pids < <(pgrep -u "$(id -u)" -x chrome || true)
          for pid in "${chrome_pids[@]}"; do
            kill -TERM "$pid" 2>/dev/null || true
          done
          sleep 3
          for pid in "${chrome_pids[@]}"; do
            kill -KILL "$pid" 2>/dev/null || true
          done
          find "$HOME/.config/google-chrome" -maxdepth 2 -name 'Singleton*' -delete 2>/dev/null || true

          # Save the whole user home, including the GitHub workspace under
          # ~/work, so files and browser/session changes survive runner teardown.
          # Exclude per-run SSH/VNC credentials, temporary workflow scripts,
          # downloaded action code, and disposable download/build caches.
          # The archive is encrypted before it enters the cache or artifact store.
          tar --exclude='./.ssh' \
              --exclude='./.vnc' \
              --exclude='./.cache' \
              --exclude='./work/_tool' \
              --exclude='./.npm' \
              --exclude='./.cargo/registry' \
              --exclude='./.rustup/downloads' \
              --exclude='./.local/share/Trash' \
              --exclude='./work/_temp' \
              --exclude='./work/_actions' \
              --exclude='*/Cache/*' \
              --exclude='*/Code Cache/*' \
              --exclude='*/GPUCache/*' \
              --exclude='*/ShaderCache/*' \
              --exclude='*/BrowserMetrics/*' \
              -C "$HOME" -czf - . |
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -pass env:TAILSCALE_AUTHKEY -out "$state_file"
          chmod 600 "$state_file"
          test -s "$state_file"
          echo "Encrypted home, workspace, desktop, and browser state saved ($(du -h "$state_file" | cut -f1))."

      - name: Save encrypted desktop-state cache
        if: always() && steps.snapshot-state.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/core2-vnc-state.tar.gz.enc
          key: core2-vnc-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload encrypted desktop-state backup
        id: upload-state
        if: always() && steps.snapshot-state.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: core2-vnc-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core2-vnc-state.tar.gz.enc
          if-no-files-found: error
          retention-days: 30

      - name: Keep only the newest encrypted state backup
        if: always() && steps.snapshot-state.outcome == 'success' && steps.upload-state.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_ARTIFACT_NAME: core2-vnc-state-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_name = os.environ["CURRENT_ARTIFACT_NAME"]
          base = f"https://api.github.com/repos/{repo}/actions/artifacts"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "core2-vnc-state-prune",
          }
          try:
              request = urllib.request.Request(base + "?per_page=100", headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  artifacts = json.load(response).get("artifacts", [])
              for artifact in artifacts:
                  name = artifact.get("name", "")
                  if not name.startswith("core2-vnc-state-") or name == current_name:
                      continue
                  delete = urllib.request.Request(
                      base + "/" + str(artifact["id"]),
                      data=b"",
                      method="DELETE",
                      headers=headers,
                  )
                  try:
                      with urllib.request.urlopen(delete, timeout=20):
                          print("Removed older encrypted state backup: " + name)
                  except urllib.error.HTTPError as exc:
                      print(f"::warning::Could not remove old backup {name}: HTTP {exc.code}")
          except Exception as exc:
              print("::warning::Could not prune old encrypted state backups: " + str(exc))
          PY

      - name: Stop VNC and SSH services
        if: always()
        shell: bash
        run: |
          vncserver -kill :1 >/dev/null 2>&1 || true
          sudo systemctl stop ssh >/dev/null 2>&1 || true
          if [[ -f /tmp/socat-vnc.pid ]]; then kill "$(cat /tmp/socat-vnc.pid)" >/dev/null 2>&1 || true; fi
