name: Find active macOS runner on Tailscale

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/tailscale-active-runner-info.yml"

permissions:
  contents: read

jobs:
  inspect-tailnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Connect diagnostic runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Find online macOS peers and test VNC/SSH ports
        shell: bash
        run: |
          set -euo pipefail
          tailscale status --json > "$RUNNER_TEMP/tailscale-status.json"
          python3 - "$RUNNER_TEMP/tailscale-status.json" <<'PY'
          import json
          import socket
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          peers = data.get("Peer") or {}
          if not peers:
          print("No peers visible in the Tailscale status response.")
          for peer in peers.values():
          hostinfo = peer.get("Hostinfo") or {}
          os_name = str(hostinfo.get("OS", peer.get("OS", "unknown"))).strip()
          online = peer.get("Online") is True
          ips = peer.get("TailscaleIPs") or []
          ip4 = next((ip for ip in ips if "." in ip), None)
          print(f"peer host={peer.get('HostName', 'unknown')} os={os_name!r} online={online} ips={ips}")
          if not online or not ip4:
          continue
          for port, label in ((5900, "VNC"), (22, "SSH")):
          try:
            with socket.create_connection((ip4, port), timeout=2):
                print(f"  {label} port {port}: OPEN")
                if port == 5900:
                    try:
                        greeting = socket.create_connection((ip4, port), timeout=2)
                        greeting.settimeout(2)
                        banner = greeting.recv(12)
                        print(f"  VNC RFB greeting: {banner!r}")
                        greeting.close()
                    except OSError as exc:
                        print(f"  VNC greeting test failed: {exc.__class__.__name__}")
          except OSError as exc:
            print(f"  {label} port {port}: not reachable ({exc.__class__.__name__})")
          PY
