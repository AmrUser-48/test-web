name: Temporary Core 2 build runner (SSH)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CFLAGS: "-O2 -march=core2 -mtune=core2"
      CXXFLAGS: "-O2 -march=core2 -mtune=core2"
      FFLAGS: "-O2 -march=core2 -mtune=core2"
      FCFLAGS: "-O2 -march=core2 -mtune=core2"
    steps:
      - name: Install build tools and Core 2 build flags
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential gcc g++ make cmake ninja-build pkg-config \
            git ca-certificates curl wget xz-utils bzip2 unzip ccache \
            dpkg-dev devscripts debhelper fakeroot quilt autoconf automake \
            libtool gettext python3 python3-venv meson
          sudo tee /etc/dpkg/buildflags.conf >/dev/null <<'FLAGS'
          SET CFLAGS -O2 -march=core2 -mtune=core2
          SET CXXFLAGS -O2 -march=core2 -mtune=core2
          SET FFLAGS -O2 -march=core2 -mtune=core2
          SET FCFLAGS -O2 -march=core2 -mtune=core2
          FLAGS
          echo "--- Runner ---"
          cat /etc/os-release
          uname -a
          gcc --version | head -n 1
          echo "--- Core 2 flags ---"
          printf 'CFLAGS=%s\nCXXFLAGS=%s\n' "$CFLAGS" "$CXXFLAGS"
          dpkg-buildflags --get CFLAGS
          dpkg-buildflags --get CXXFLAGS

      - name: Open temporary SSH shell
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 360
