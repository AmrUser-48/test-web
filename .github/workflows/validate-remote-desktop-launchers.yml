name: Validate remote desktop launchers

on:
  push:
    paths:
      - "scripts/macos-runner-launcher/**"
      - ".github/workflows/temporary-core2-build-runner-vnc.yml"
      - ".github/workflows/macos-chatgpt-vnc.yml"
      - ".github/workflows/validate-remote-desktop-launchers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/macos-runner-launcher/macos-runner-one-click.py
          rm -rf scripts/macos-runner-launcher/__pycache__

      - name: Validate installer shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/macos-runner-launcher/install-desktop-launcher.sh

      - name: Validate launcher and workflow contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          launcher = Path("scripts/macos-runner-launcher/macos-runner-one-click.py").read_text()
          installer = Path("scripts/macos-runner-launcher/install-desktop-launcher.sh").read_text()
          docs = Path("scripts/macos-runner-launcher/README.md").read_text()
          workflow = Path(".github/workflows/temporary-core2-build-runner-vnc.yml").read_text()
          macos_workflow = Path(".github/workflows/macos-chatgpt-vnc.yml").read_text()
          restore_step = workflow.split("- name: Restore desktop, browser profile, and files", 1)[1].split("- name: Install Core 2 build tools", 1)[0]

          required = {
              "macOS workflow target": '"macos-chatgpt-vnc.yml"' in launcher,
              "Ubuntu workflow target": '"temporary-core2-build-runner-vnc.yml"' in launcher,
              "Core 2 peer matching and RustDesk artifact targeting": '"github-core2"' in launcher and 'RUSTDESK_ARTIFACT_PREFIX' in launcher,
              "saved VNC password file": '"-passwd", str(VNC_PASS_FILE)' in launcher,
              "viewer exit leaves remote workflow alive": "Closing or crashing TigerVNC will NOT stop the remote workflow." in launcher and "The remote workflow remains active until its configured timeout." in launcher and "Close the VNC viewer or press Ctrl+C here to stop this workflow." not in launcher,
              "token saved with restrictive permissions": 'os.chmod(TOKEN_FILE, 0o600)' in launcher,
              "both desktop icons": "Launch macOS ChatGPT Runner.desktop" in installer and "Launch Ubuntu Core2 VNC Runner.desktop" in installer,
              "no automatic apt installs in installer": "apt-get install" not in installer and "apt install" not in installer,
              "Arc-Dark theme": "Arc-Dark" in workflow,
              "right-side vertical deskbar": "mode int 2" in workflow and "p=2;x=0;y=0" in workflow,
              "encrypted desktop state": "openssl enc -aes-256-cbc -pbkdf2 -salt" in workflow,
              "cache restoration": "actions/cache/restore@v4" in workflow,
              "push recovery skips legacy cache": "if: github.event_name != 'push'" in workflow,
              "push recovery skips old backup artifact": "github.event_name != 'push' && steps.cached-state.outputs.available != 'true'" in workflow,
              "backup artifact fallback": "actions/download-artifact@v4" in workflow,
              "state restore directory outside home": 'restore_dir="/tmp/core2-vnc-state-restore-$GITHUB_RUN_ID"' in restore_step,
              "state extraction has process-group timeout": "timeout --signal=TERM --kill-after=10s 240s bash -o pipefail -c" in restore_step and "timeout --foreground --signal" not in restore_step,
              "state copy has timeout": 'timeout --signal=TERM --kill-after=10s 180s cp -a' in restore_step,
              "future snapshots exclude runner tool cache": "--exclude='./work/_tool'" in workflow,
              "state snapshot before service shutdown": workflow.index("Snapshot and encrypt desktop state") < workflow.index("Stop VNC and SSH services"),
              "docs explain local credential handling": "This local VNC password file is obfuscated by TigerVNC" in docs and "decrypts it locally using OpenSSL" in docs,
              "macOS workflow is manual-only": "push:" not in macos_workflow,
              "macOS workflow uses Apple Silicon runner": "runs-on: macos-15" in macos_workflow,
              "macOS workflow installs current RustDesk ARM64 app": 'VERSION="1.5.0"' in macos_workflow and "aarch64.dmg" in macos_workflow and "Install and verify RustDesk" in macos_workflow,
              "macOS workflow avoids native Screen Sharing": "screensharingd" not in macos_workflow and "RFB" not in macos_workflow and "kickstart" not in macos_workflow,
              "macOS connection credentials are encrypted": "openssl enc -aes-256-cbc -pbkdf2 -salt" in macos_workflow and "-pass env:VNC_PASSWORD" in macos_workflow and "macos-rustdesk-credentials-" in macos_workflow and "github.run_id" in macos_workflow,
              "launcher decrypts the artifact locally": "StripCrossHostAuthorizationRedirect" in launcher and '"openssl", "enc", "-d", "-aes-256-cbc", "-pbkdf2", "-salt"' in launcher,
              "macOS no longer requires Tailscale or TigerVNC": 'if target["connection"] == "rustdesk":' in launcher and 'require_command("rustdesk")' in launcher,
              "installer checks RustDesk without auto-installing": 'command -v rustdesk' in installer and "apt install" not in installer,
          }
          for name, passed in required.items():
              print(("PASS" if passed else "FAIL") + ": " + name)
          failures = [name for name, passed in required.items() if not passed]
          if failures:
              raise SystemExit(f"{len(failures)} validation check(s) failed")
          PY
