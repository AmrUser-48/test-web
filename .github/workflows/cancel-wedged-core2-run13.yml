name: Finish cancelling wedged Core 2 run 13

on:
  push:
    paths:
      - ".github/workflows/cancel-wedged-core2-run13.yml"

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel and verify run 13
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/38164788434"
          HEADERS=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          echo "Requesting ordinary cancellation."
          curl --fail-with-body --silent --show-error -X POST "${HEADERS[@]}" "$API/cancel" || true
          sleep 3
          echo "Requesting force cancellation."
          curl --fail-with-body --silent --show-error -X POST "${HEADERS[@]}" "$API/force-cancel" || true
          for _ in $(seq 1 20); do
            STATUS="$(curl --fail-with-body --silent --show-error "${HEADERS[@]}" "$API" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status","unknown"))')"
            echo "Run 13 status: $STATUS"
            if [[ "$STATUS" == "completed" ]]; then
              echo "Run 13 is stopped."
              exit 0
            fi
            sleep 3
          done
          echo "::warning::GitHub still reports run 13 as active after cancellation requests."
