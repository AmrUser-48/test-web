name: Temporary macOS ChatGPT VNC (M1)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: How long to keep the macOS desktop online
        required: true
        type: choice
        options:
          - "30"
          - "60"
          - "180"
          - "300"
          - "350"
        default: "350"
  push:
    paths:
      - ".github/workflows/macos-chatgpt-vnc.yml"

permissions:
  contents: read

concurrency:
  group: macos-chatgpt-vnc-v4
  cancel-in-progress: true

jobs:
  macos-vnc:
    name: Start temporary macOS M1 desktop
    runs-on: macos-15
    timeout-minutes: 360
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      SESSION_MINUTES: ${{ inputs.session_minutes || '350' }}

    steps:
      - name: Validate secrets
        shell: bash
        run: |
          if [[ -z "$TAILSCALE_AUTHKEY" ]]; then
            echo "::error::Missing TAILSCALE_AUTHKEY repository secret."
            exit 1
          fi
          if [[ -z "$VNC_PASSWORD" || ${#VNC_PASSWORD} -lt 8 ]]; then
            echo "::error::Missing VNC_PASSWORD repository secret (minimum 8 characters)."
            exit 1
          fi

      - name: Connect macOS runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Report hardware and launch Chrome at ChatGPT
        shell: bash
        run: |
          set -euo pipefail
          echo "=== macOS runner ==="
          sw_vers
          uname -a
          echo "=== Hardware (bounded diagnostic) ==="
          python3 - <<'PY'
          import subprocess
          for data_type in ("SPHardwareDataType", "SPDisplaysDataType"):
              print("--- " + data_type + " ---", flush=True)
              try:
                  p = subprocess.run(
                      ["system_profiler", data_type],
                      capture_output=True, text=True, timeout=12
                  )
                  for line in p.stdout.splitlines():
                      if any(k in line for k in (
                          "Model Name", "Model Identifier", "Chip:", "Chipset Model",
                          "Total Number of Cores", "Memory:", "Metal"
                      )):
                          print(line, flush=True)
                  if p.returncode:
                      print("system_profiler exit:", p.returncode, flush=True)
              except subprocess.TimeoutExpired:
                  print("system_profiler timed out; continuing.", flush=True)
          PY

          if [[ ! -d "/Applications/Google Chrome.app" ]]; then
            echo "::error::Google Chrome is not installed on this macOS image."
            exit 1
          fi

          PROFILE_DIR="$RUNNER_TEMP/chatgpt-chrome-profile"
          mkdir -p "$PROFILE_DIR"
          nohup open -a "Google Chrome" --args \
            --user-data-dir="$PROFILE_DIR" \
            --no-first-run \
            --no-default-browser-check \
            --remote-debugging-port=9222 \
            https://chatgpt.com >/tmp/chrome-open.log 2>&1 </dev/null &

          # Hosted macOS can suspend headful applications without an active GUI session.
          # Do not make Chrome's optional debugging port a prerequisite for Screen Sharing.
          sleep 3
          echo "=== Chrome process ==="
          ps aux | grep -i '[G]oogle Chrome' || true
          echo "=== GUI session ==="
          who || true
          launchctl list | grep -E 'WindowServer|loginwindow|screensharing' || true
          echo "Chrome launch log:"
          cat /tmp/chrome-open.log || true


      - name: Enable macOS Screen Sharing (VNC)
        shell: bash
        run: |
          set -euo pipefail
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          if [[ ! -x "$KICKSTART" ]]; then
            echo "::error::Apple Remote Desktop kickstart is unavailable on this macOS image."
            ls -ld /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources 2>/dev/null || true
            exit 1
          fi

          # VNC legacy authentication supports only the first eight password characters.
          VNC_PASS_SHORT="${VNC_PASSWORD:0:8}"
          sudo "$KICKSTART" \
            -activate \
            -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -configure -privs -all \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PASS_SHORT" \
            -restart -agent

          sudo launchctl enable system/com.apple.screensharing || true
          sudo launchctl kickstart -k system/com.apple.screensharing || true
          sleep 3

          TAILSCALE_IP="$(tailscale ip -4 | head -n 1)"
          if [[ -z "$TAILSCALE_IP" ]]; then
            echo "::error::Tailscale did not assign a private IP."
            exit 1
          fi
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"
          printf 'os=macOS\nhostname=%s\ntailscale_ip=%s\n' "$(hostname)" "$TAILSCALE_IP" > "$RUNNER_TEMP/macos-runner-info.txt"
          echo "MACOS_RUNNER_HOSTNAME=$(hostname)"
          echo "MACOS_RUNNER_TAILSCALE_IP=$TAILSCALE_IP"

          echo "=== Port 5900 listener ==="
          lsof -nP -iTCP:5900 -sTCP:LISTEN || true

          # Verify that the service actually sends an RFB greeting, not just that
          # TCP accepts a connection.
          ready=0
          for _ in $(seq 1 20); do
            reply="$(timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/5900; head -c 12 <&3' 2>/dev/null || true)"
            if [[ "$reply" == RFB* ]]; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" == "1" ]]; then
            echo "MACOS_VNC_READY=1" >> "$GITHUB_ENV"
            echo "PASS: Screen Sharing sent RFB greeting: $reply"
          else
            echo "MACOS_VNC_READY=0" >> "$GITHUB_ENV"
            echo "::warning::This hosted macOS VM has no active Screen Sharing listener; continuing with SSH over Tailscale."
            sudo launchctl print system/com.apple.screensharing || true
          fi

          {
            echo "## macOS runner — private Tailscale access"
            echo
            echo "- Runner: macOS 15 / Apple Silicon"
            echo "- Tailscale IP: `$TAILSCALE_IP`"
            if [[ "$ready" == "1" ]]; then
              echo "- VNC address for TigerVNC: `$TAILSCALE_IP::5900`"
              echo "- VNC password: first 8 characters of the existing `VNC_PASSWORD` secret"
            else
              echo "- Native macOS VNC: unavailable on this headless runner (no active WindowServer/Screen Sharing listener)."
              echo "- Use the SSH endpoint provided by the next step."
            fi
            echo "- Session duration: $SESSION_MINUTES minutes"
            echo
            echo "The services are intended for private Tailscale access only. Do not expose them through a public tunnel."
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Enable SSH on the private Tailscale address
        shell: bash
        run: |
          set -euo pipefail
          TAILSCALE_IP="$(tailscale ip -4 | head -n 1)"
          SSH_USER="$(id -un)"
          KEY_BASE="$RUNNER_TEMP/macos-runner-ssh"

          # Generate a short-lived ed25519 key; encrypt the downloadable private key
          # with the existing VNC_PASSWORD secret before uploading it.
          ssh-keygen -q -t ed25519 -N "" -C "GitHub macOS runner $GITHUB_RUN_ID" -f "$KEY_BASE"
          install -d -m 700 "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          cat "$KEY_BASE.pub" >> "$HOME/.ssh/authorized_keys"

          # The service is bound to the private Tailscale IP only; avoid
          # systemsetup/launchctl operations that can stall in headless hosted VMs.
          sudo install -d -m 0755 /var/empty
          sudo /usr/sbin/sshd -t
          sudo nohup /usr/sbin/sshd -D \
            -o "ListenAddress=$TAILSCALE_IP" \
            -o "PermitRootLogin=no" \
            -o "PasswordAuthentication=no" \
            -o "KbdInteractiveAuthentication=no" \
            -o "PubkeyAuthentication=yes" \
            -o "AllowUsers=$SSH_USER" \
            >>"$RUNNER_TEMP/sshd.log" 2>&1 </dev/null &

          ready=0
          for _ in $(seq 1 20); do
            if nc -z -w 2 "$TAILSCALE_IP" 22; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$RUNNER_TEMP/sshd.log" || true
            echo "::error::SSH did not listen on the Tailscale IP $TAILSCALE_IP:22."
            exit 1
          fi

          if [[ -z "$VNC_PASSWORD" || ${#VNC_PASSWORD} -lt 8 ]]; then
            echo "::error::VNC_PASSWORD must be set and contain at least 8 characters to encrypt the SSH key."
            exit 1
          fi
          ssh-keygen -p -P "" -N "$VNC_PASSWORD" -f "$KEY_BASE" >/dev/null
          echo "MACOS_SSH_KEY_PATH=$KEY_BASE" >> "$GITHUB_ENV"
          echo "MACOS_SSH_USER=$SSH_USER" >> "$GITHUB_ENV"

          {
            echo
            echo "### Private SSH access"
            echo
            echo "- SSH address: `$SSH_USER@$TAILSCALE_IP` (port 22, Tailscale IP only)"
            echo "- Download artifact: `macos-tailscale-ssh-key-${GITHUB_RUN_ID}`"
            echo "- The private key is encrypted; use the full `VNC_PASSWORD` secret as its passphrase."
            echo "- Debian command after extracting the artifact: `chmod 600 macos-runner-ssh && ssh -i macos-runner-ssh $SSH_USER@$TAILSCALE_IP`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PASS: SSH is listening on the private Tailscale IP $TAILSCALE_IP:22."

      - name: Upload encrypted macOS SSH key
        uses: actions/upload-artifact@v4
        with:
          name: macos-tailscale-ssh-key-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-runner-ssh
          if-no-files-found: error
          retention-days: 1

      - name: Upload verified macOS runner address
        uses: actions/upload-artifact@v4
        with:
          name: macos-runner-address-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-runner-info.txt
          if-no-files-found: error
          retention-days: 1

      - name: Keep macOS desktop alive
        shell: bash
        run: sleep "$((SESSION_MINUTES * 60))"

      - name: Disable Screen Sharing
        if: always()
        shell: bash
        run: |
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          if [[ -x "$KICKSTART" ]]; then
            sudo "$KICKSTART" -deactivate -configure -access -off || true
          fi
