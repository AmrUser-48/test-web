name: Temporary macOS ChatGPT Desktop (M1, RustDesk)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: How long to keep the macOS desktop online
        required: true
        type: choice
        options:
          - "30"
          - "60"
          - "180"
          - "300"
          - "350"
        default: "350"

permissions:
  contents: read

concurrency:
  group: macos-chatgpt-rustdesk-v1
  cancel-in-progress: true

jobs:
  macos-desktop:
    name: Start temporary macOS M1 desktop
    runs-on: macos-15
    timeout-minutes: 360
    env:
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      SESSION_MINUTES: ${{ inputs.session_minutes || '350' }}

    steps:
      - name: Validate credential-encryption secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$VNC_PASSWORD" || ${#VNC_PASSWORD} -lt 8 ]]; then
            echo "::error::Set repository secret VNC_PASSWORD (at least 8 characters). It encrypts the short-lived RustDesk credentials artifact."
            exit 1
          fi

      - name: Report hardware and launch Chrome at ChatGPT
        shell: bash
        run: |
          set -euo pipefail
          echo "=== macOS runner ==="
          sw_vers
          uname -a
          echo "=== Hardware ==="
          python3 - <<'PY'
          import subprocess
          for data_type in ("SPHardwareDataType", "SPDisplaysDataType"):
              try:
                  p = subprocess.run(
                      ["system_profiler", data_type],
                      capture_output=True, text=True, timeout=12
                  )
                  for line in p.stdout.splitlines():
                      if any(k in line for k in (
                          "Model Name", "Model Identifier", "Chip:",
                          "Chipset Model", "Total Number of Cores", "Memory:"
                      )):
                          print(line, flush=True)
              except subprocess.TimeoutExpired:
                  print("system_profiler timed out; continuing.", flush=True)
          PY

          if [[ ! -d "/Applications/Google Chrome.app" ]]; then
            echo "::error::Google Chrome is not installed on this macOS image."
            exit 1
          fi

          PROFILE_DIR="$RUNNER_TEMP/chatgpt-chrome-profile"
          mkdir -p "$PROFILE_DIR"
          nohup open -a "Google Chrome" --args \
            --user-data-dir="$PROFILE_DIR" \
            --no-first-run \
            --no-default-browser-check \
            https://chatgpt.com >/tmp/chrome-open.log 2>&1 </dev/null &

          sleep 3
          echo "=== Chrome process ==="
          ps aux | grep -i '[G]oogle Chrome' || true
          echo "Chrome launch log:"
          cat /tmp/chrome-open.log || true

      - name: Install and verify RustDesk
        id: rustdesk
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.5.0"
          DMG="$RUNNER_TEMP/rustdesk-${VERSION}-aarch64.dmg"
          MOUNT="$RUNNER_TEMP/rustdesk-mount"
          APP="/Applications/RustDesk.app"
          mkdir -p "$MOUNT"

          curl -fL --retry 3 --connect-timeout 20 \
            "https://github.com/rustdesk/rustdesk/releases/download/${VERSION}/rustdesk-${VERSION}-aarch64.dmg" \
            -o "$DMG"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
          if [[ ! -d "$MOUNT/RustDesk.app" ]]; then
            echo "::error::RustDesk.app was not found in the downloaded disk image."
            ls -la "$MOUNT" || true
            hdiutil detach "$MOUNT" -quiet || true
            exit 1
          fi
          sudo rm -rf "$APP"
          sudo ditto "$MOUNT/RustDesk.app" "$APP"
          hdiutil detach "$MOUNT" -quiet
          rm -f "$DMG"

          RUSTDESK_BIN="$APP/Contents/MacOS/RustDesk"
          if [[ ! -x "$RUSTDESK_BIN" ]]; then
            RUSTDESK_BIN="$APP/Contents/MacOS/rustdesk"
          fi
          if [[ ! -x "$RUSTDESK_BIN" ]]; then
            echo "::error::RustDesk executable is missing from the installed app."
            exit 1
          fi

          echo "Installed RustDesk ${VERSION}."
          open -a "$APP" || true
          sleep 5

          # RustDesk requires an elevated CLI for permanent-password setup on macOS.
          RUSTDESK_PASSWORD="$(openssl rand -hex 12)"
          echo "::add-mask::${RUSTDESK_PASSWORD}"
          echo "RUSTDESK_PASSWORD=${RUSTDESK_PASSWORD}" >> "$GITHUB_ENV"

          PASSWORD_RESULT="$(sudo "$RUSTDESK_BIN" --password "$RUSTDESK_PASSWORD" 2>/dev/null || true)"
          if [[ "$PASSWORD_RESULT" != *"Done!"* ]]; then
            echo "::error::RustDesk rejected permanent-password setup. No credentials artifact will be published."
            exit 1
          fi
          echo "RustDesk permanent password configured."

          RUSTDESK_ID=""
          for attempt in $(seq 1 18); do
            RUSTDESK_ID="$(sudo "$RUSTDESK_BIN" --get-id 2>/dev/null | tr -d '\r\n' || true)"
            if [[ "$RUSTDESK_ID" =~ ^[0-9]{6,12}$ ]]; then
              break
            fi
            RUSTDESK_ID=""
            sleep 5
          done
          if [[ ! "$RUSTDESK_ID" =~ ^[0-9]{6,12}$ ]]; then
            echo "::error::RustDesk did not obtain a numeric relay ID within 90 seconds."
            grep -Eiv 'password|secret|token|key' /tmp/rustdesk.log 2>/dev/null | tail -60 || true
            exit 1
          fi

          echo "RUSTDESK_ID=${RUSTDESK_ID}" >> "$GITHUB_ENV"
          echo "RustDesk registered an ID successfully."
          echo "MACOS_DESKTOP_READY=1" >> "$GITHUB_ENV"

      - name: Encrypt and upload connection credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          OUT="$RUNNER_TEMP/macos-rustdesk-credentials"
          PLAINTEXT="$RUNNER_TEMP/connection-info.txt"
          mkdir -p "$OUT"
          cat > "$PLAINTEXT" <<EOF
          RUSTDESK_ID=${RUSTDESK_ID}
          RUSTDESK_PASSWORD=${RUSTDESK_PASSWORD}
          SESSION_MINUTES=${SESSION_MINUTES}
          EOF
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass env:VNC_PASSWORD \
            -in "$PLAINTEXT" \
            -out "$OUT/connection-info.txt.enc"
          rm -f "$PLAINTEXT"
          chmod 600 "$OUT/connection-info.txt.enc"
          {
            echo "## macOS desktop is ready"
            echo
            echo "- Runner: macOS 15 / Apple Silicon (M1)"
            echo "- Remote access: RustDesk relay"
            echo "- Session duration: ${SESSION_MINUTES} minutes"
            echo "- Download artifact: macos-rustdesk-credentials-${GITHUB_RUN_ID}"
            echo "- The credential artifact is encrypted with repository secret VNC_PASSWORD; the password is not printed in logs."
            echo
            echo "On Debian, use the one-click launcher to download/decrypt credentials and open RustDesk. Closing RustDesk does not stop this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted RustDesk credentials
        uses: actions/upload-artifact@v4
        with:
          name: macos-rustdesk-credentials-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-rustdesk-credentials/connection-info.txt.enc
          if-no-files-found: error
          retention-days: 1

      - name: Keep macOS desktop alive
        shell: bash
        run: sleep "$((SESSION_MINUTES * 60))"
