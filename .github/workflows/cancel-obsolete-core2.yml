name: Cancel obsolete Core 2 recovery run

on:
  push:
    paths:
      - ".github/workflows/cancel-obsolete-core2.yml"

permissions:
  actions: write

jobs:
  cancel-obsolete:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel old run 14
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/38165576011/force-cancel"
          echo "Obsolete run 14 cancellation requested."
