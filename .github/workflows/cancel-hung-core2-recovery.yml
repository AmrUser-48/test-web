name: Cancel hung Core 2 recovery attempts

on:
  push:
    paths:
      - ".github/workflows/cancel-hung-core2-recovery.yml"

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel recovery runs 15 and 16
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEADERS=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          for RUN_ID in 38165672757 38166013811; do
            API="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
            echo "Force-cancelling run $RUN_ID."
            curl --fail-with-body --silent --show-error -X POST "${HEADERS[@]}" "$API/force-cancel" || true
          done
          for _ in $(seq 1 20); do
            A="$(curl --fail-with-body --silent --show-error "${HEADERS[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/38165672757" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("status","unknown"))')"
            B="$(curl --fail-with-body --silent --show-error "${HEADERS[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/38166013811" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("status","unknown"))')"
            echo "Run 15: $A; run 16: $B"
            if [[ "$A" == "completed" && "$B" == "completed" ]]; then exit 0; fi
            sleep 3
          done
          echo "::warning::At least one recovery run is still cancelling."
