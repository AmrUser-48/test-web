name: Temporary remote ChatGPT Chromium

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: Session duration (runner limit is 6 hours)
        required: true
        type: choice
        options:
          - "30"
          - "60"
          - "180"
          - "300"
          - "350"
        default: "60"

permissions:
  contents: read

jobs:
  remote-browser:
    name: Start temporary Chromium browser
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BROWSER_ACCESS_PASSWORD: ${{ secrets.BROWSER_ACCESS_PASSWORD }}
      SESSION_MINUTES: ${{ inputs.session_minutes }}
    steps:
      - name: Validate access password
        shell: bash
        run: |
          if [[ -z "$BROWSER_ACCESS_PASSWORD" || ${#BROWSER_ACCESS_PASSWORD} -lt 20 ]]; then
            echo "::error::Add BROWSER_ACCESS_PASSWORD under Settings → Secrets and variables → Actions. Use at least 20 characters."
            exit 1
          fi
          if [[ ! "$BROWSER_ACCESS_PASSWORD" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Use only A-Z, a-z, 0-9, dot, underscore, or hyphen in BROWSER_ACCESS_PASSWORD; LinuxServer templated config can break on shell-special characters."
            exit 1
          fi

      - name: Start Chromium directly at ChatGPT
        shell: bash
        run: |
          set -euo pipefail
          docker pull lscr.io/linuxserver/chromium:latest
          docker run -d --name remote-chatgpt --shm-size=1g \
            -e TZ=Etc/UTC \
            -e PIXELFLUX_WAYLAND=false \
            -e DISABLE_DRI3=true \
            -e SELKIES_MODE=websockets \
            -e SELKIES_ENCODER=jpeg \
            -e SELKIES_FRAMERATE=20 \
            -e SELKIES_JPEG_QUALITY=60 \
            -e SELKIES_DEBUG=true \
            -e CHROME_CLI=/config/.config/chromium\ https://chatgpt.com \
            -e CUSTOM_USER=remote \
            -e PASSWORD="$BROWSER_ACCESS_PASSWORD" \
            -p 127.0.0.1:3000:3000 \
            lscr.io/linuxserver/chromium:latest
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS -u "remote:$BROWSER_ACCESS_PASSWORD" http://127.0.0.1:3000/ -o /tmp/chromium-page.html; then ready=1; break; fi
            sleep 5
          done
          if [[ "$ready" != 1 ]]; then
            docker logs --tail=200 remote-chatgpt || true
            echo "::error::Chromium remote interface did not start."
            exit 1
          fi
          if ! docker exec remote-chatgpt sh -lc "ps -ef | grep -E '[c]hromium|[c]hrome' >/dev/null"; then
            docker logs --tail=200 remote-chatgpt || true
            echo "::error::The interface answers, but the Chromium process is not running."
            exit 1
          fi
          chrome_args="$(docker exec remote-chatgpt sh -lc "ps -eo args | grep '[c]hromium --show-component-extension-options' | head -n 1" || true)"
          echo "Chromium launch args: $chrome_args"
          if [[ "$chrome_args" != *"--user-data-dir /config/.config/chromium https://chatgpt.com"* ]]; then
            docker logs --tail=200 remote-chatgpt || true
            echo "::error::Chromium did not receive the expected user-data directory followed by the ChatGPT URL."
            exit 1
          fi
          echo "Local interface responds and Chromium has the intended startup URL."

      - name: Start HTTPS tunnel and test WebSocket
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate \
            >/tmp/cloudflared.log 2>&1 &
          ready=0
          for _ in $(seq 1 60); do
            url="$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            if [[ -n "$url" ]]; then ready=1; break; fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            cat /tmp/cloudflared.log || true
            echo "::error::Could not establish the Cloudflare tunnel."
            exit 1
          fi
          echo "Remote Chromium URL: $url"
          {
            echo "## Temporary remote ChatGPT Chromium"
            echo
            echo "$url"
            echo
            echo "Browser authentication: username remote; password is the BROWSER_ACCESS_PASSWORD secret."
            echo "Chromium is configured to open https://chatgpt.com automatically."
            echo "Session ends in $SESSION_MINUTES minutes; cancel this workflow to stop earlier."
          } >> "$GITHUB_STEP_SUMMARY"

          external_ready=0
          for _ in $(seq 1 12); do
            if curl --connect-timeout 5 --max-time 15 -fsS -u "remote:$BROWSER_ACCESS_PASSWORD" "$url/" -o /tmp/external-page.html; then external_ready=1; break; fi
            sleep 5
          done
          if [[ "$external_ready" != 1 ]]; then
            cat /tmp/cloudflared.log || true
            echo "::error::The external HTTPS URL did not answer with valid authentication."
            exit 1
          fi
          if ! grep -qiE 'selkies|chromium' /tmp/external-page.html; then
            echo "::error::The tunnel returned a page that does not look like the remote Chromium interface."
            head -c 1200 /tmp/external-page.html || true
            exit 1
          fi

          # Test with a real browser client. A bare curl HTTP 101 handshake does not
          # speak the Selkies protocol and can make the server stop its capture pipeline.
          mkdir -p "$RUNNER_TEMP/selkies-browser-check"
          cd "$RUNNER_TEMP/selkies-browser-check"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

          export SELKIES_PUBLIC_URL="$url"
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            let browser;
            const pageErrors = [];
            const sockets = [];
            try {
              browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
              const context = await browser.newContext({
                httpCredentials: {
                  username: 'remote',
                  password: process.env.BROWSER_ACCESS_PASSWORD,
                  origin: new URL(process.env.SELKIES_PUBLIC_URL).origin,
                  send: 'always'
                },
                viewport: { width: 1280, height: 800 }
              });
              const page = await context.newPage();
              page.on('pageerror', error => pageErrors.push(String(error.message).slice(0, 400)));
              page.on('console', message => {
                if (message.type() === 'error') pageErrors.push(String(message.text()).slice(0, 400));
              });
              page.on('websocket', socket => {
                const record = {
                  url: socket.url(),
                  receivedFrames: 0,
                  binaryFrames: 0,
                  largeBinaryFrames: 0,
                  binaryBytes: 0,
                  closed: false,
                  errors: []
                };
                sockets.push(record);
                socket.on('framereceived', event => {
                  record.receivedFrames++;
                  if (typeof event.payload !== 'string') {
                    const size = event.payload.length || 0;
                    record.binaryFrames++;
                    record.binaryBytes += size;
                    if (size >= 128) record.largeBinaryFrames++;
                  }
                });
                socket.on('socketerror', error => record.errors.push(String(error).slice(0, 300)));
                socket.on('close', () => { record.closed = true; });
              });

              const response = await page.goto(process.env.SELKIES_PUBLIC_URL, {
                waitUntil: 'domcontentloaded',
                timeout: 45000
              });
              console.log('Browser client page HTTP status: ' + (response ? response.status() : 'no response'));
              console.log('Browser client title: ' + (await page.title()));
              await page.waitForTimeout(15000);

              const matching = sockets.filter(socket => {
                try { return new URL(socket.url).pathname.endsWith('/api/websockets'); }
                catch (_) { return false; }
              });
              console.log('Selkies browser WebSocket: ' + JSON.stringify(matching));
              console.log('Browser page errors: ' + JSON.stringify(pageErrors.slice(0, 12)));

              const receivesScreenData = matching.some(socket =>
                socket.binaryFrames > 0 && socket.largeBinaryFrames > 0
              );
              if (!response || response.status() !== 200 || matching.length === 0 || !receivesScreenData) {
                await page.screenshot({ path: '/tmp/selkies-browser-check.png', fullPage: true }).catch(() => {});
                throw new Error('Public page did not establish a Selkies session receiving binary stream frames.');
              }
              console.log('PASS: public page loaded and a real Selkies client received binary stream frames.');
            } catch (error) {
              console.error('Browser-level streaming test failed: ' + (error && error.stack ? error.stack : error));
              process.exitCode = 1;
            } finally {
              if (browser) await browser.close().catch(() => {});
            }
          })();
          NODE

          echo "--- Chromium/stream startup diagnostics ---"
          sleep 8
          docker exec remote-chatgpt sh -lc 'printf "DISPLAY="; printf "%s\\n" "$DISPLAY"; printf "\\nProcesses:\\n"; ps -ef | grep -E "[c]hromium|[c]hrome|[s]elkies|[p]ixelflux|[n]ginx"; printf "\\nHTTP listeners:\\n"; (ss -lntp || netstat -lntp || true)' || true
          docker logs --tail=120 remote-chatgpt || true
          echo "--- End startup diagnostics ---"


      - name: Keep session alive
        shell: bash
        run: sleep "$((SESSION_MINUTES * 60))"

      - name: Remove browser
        if: always()
        shell: bash
        run: docker rm -f remote-chatgpt >/dev/null 2>&1 || true
