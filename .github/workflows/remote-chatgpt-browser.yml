name: Temporary remote ChatGPT VNC

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: Session duration (runner limit is 6 hours)
        required: true
        type: choice
        options:
          - "30"
          - "60"
          - "180"
          - "300"
          - "350"
        default: "60"
  push:
    paths:
      - ".github/workflows/remote-chatgpt-browser.yml"

permissions:
  contents: read

jobs:
  remote-vnc:
    name: Start temporary Chromium VNC session
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      SESSION_MINUTES: ${{ inputs.session_minutes || '60' }}

    steps:
      - name: Check Tailscale key
        shell: bash
        run: |
          if [[ -z "$TAILSCALE_AUTHKEY" ]]; then
            echo "::error::Add a Tailscale auth key as the TAILSCALE_AUTHKEY repository secret."
            exit 1
          fi

      - name: Connect runner to private Tailscale network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Start Chromium at ChatGPT
        shell: bash
        run: |
          set -euo pipefail
          TAILSCALE_IP="$(tailscale ip -4 | head -n 1)"
          if [[ -z "$TAILSCALE_IP" ]]; then
            echo "::error::Tailscale did not assign this runner a private IP."
            exit 1
          fi

          docker pull lscr.io/linuxserver/chromium:latest
          docker run -d --name remote-chatgpt --shm-size=1g \
            -e TZ=Etc/UTC \
            -e PIXELFLUX_WAYLAND=false \
            -e DISABLE_DRI3=true \
            -e CHROME_CLI=https://chatgpt.com \
            -p "${TAILSCALE_IP}:5900:5900" \
            lscr.io/linuxserver/chromium:latest

          ready=0
          for _ in $(seq 1 60); do
            if docker exec remote-chatgpt sh -lc "ps -ef | grep -E '[c]hromium|[c]hrome' >/dev/null"; then
              ready=1
              break
            fi
            sleep 5
          done
          if [[ "$ready" != 1 ]]; then
            docker logs --tail=200 remote-chatgpt || true
            echo "::error::Chromium did not start."
            exit 1
          fi

          chrome_args="$(docker exec remote-chatgpt sh -lc "ps -eo args | grep '[c]hromium --show-component-extension-options' | head -n 1" || true)"
          echo "Chromium launch args: $chrome_args"
          if [[ "$chrome_args" != *"https://chatgpt.com"* ]]; then
            docker logs --tail=200 remote-chatgpt || true
            echo "::error::Chromium did not receive the ChatGPT startup URL."
            exit 1
          fi

          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"
          echo "Runner Tailscale IP: $TAILSCALE_IP"

      - name: Start native VNC server inside Chromium container
        shell: bash
        run: |
          set -euo pipefail

          # The container already runs Xvfb; x11vnc shares that same X11 display.
          # -noshm avoids the MIT-SHM attach crash seen on the first runner attempt.
          docker exec -u root remote-chatgpt sh -lc 'apt-get update && apt-get install -y --no-install-recommends x11vnc'

          DISPLAY_NAME="$(docker exec remote-chatgpt sh -lc 'ps -ef | grep -oE "Xvfb :[0-9]+" | head -n 1 | sed "s/Xvfb //"')"
          if [[ -z "$DISPLAY_NAME" ]]; then
            docker exec remote-chatgpt sh -lc 'ps -ef | grep -E "[X]vfb|[X]org" || true'
            docker logs --tail=200 remote-chatgpt || true
            echo "::error::Could not detect the X11 display in the Chromium container."
            exit 1
          fi
          echo "Sharing X11 display $DISPLAY_NAME"

          docker exec -u root -d remote-chatgpt sh -lc "x11vnc -display '$DISPLAY_NAME' -noshm -rfbport 5900 -forever -shared -nopw -listen 0.0.0.0 -noxdamage -repeat >/tmp/x11vnc.log 2>&1"

          ready=0
          for _ in $(seq 1 30); do
            reply="$(timeout 3 bash -c 'exec 3<>/dev/tcp/$1/5900; head -c 12 <&3' _ "$TAILSCALE_IP" 2>/dev/null || true)"
            if [[ "$reply" == RFB* ]]; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" != 1 ]]; then
            docker exec remote-chatgpt sh -lc 'cat /tmp/x11vnc.log || true; ps -ef | grep "[x]11vnc" || true'
            docker logs --tail=100 remote-chatgpt || true
            echo "::error::VNC did not answer on the private Tailscale address."
            exit 1
          fi

          {
            echo "## Remote ChatGPT — native VNC"
            echo
            echo "Runner address: `$TAILSCALE_IP`"
            echo
            echo "Open TigerVNC Viewer on Debian and connect to:"
            echo
            echo "`$TAILSCALE_IP::5900`"
            echo
            echo "The VNC port is bound only to the private Tailscale IP; it is not published to the public internet."
            echo "The VNC service has no separate password because access is restricted to your authenticated Tailscale network."
            echo "Session ends in $SESSION_MINUTES minutes. Cancel this workflow to stop sooner."
          } >> "$GITHUB_STEP_SUMMARY"

          tailscale status || true
          echo "PASS: native VNC is answering at $TAILSCALE_IP:5900."

      - name: Keep session alive
        shell: bash
        run: sleep "$((SESSION_MINUTES * 60))"

      - name: Remove browser
        if: always()
        shell: bash
        run: docker rm -f remote-chatgpt >/dev/null 2>&1 || true
