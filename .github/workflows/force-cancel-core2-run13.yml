name: Force-cancel stuck Core 2 runner run 13

on:
  push:
    paths:
      - ".github/workflows/force-cancel-core2-run13.yml"

permissions:
  actions: write

jobs:
  force-cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Force-cancel run 13
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/38164788434/force-cancel"
          echo "Force-cancel request accepted."
